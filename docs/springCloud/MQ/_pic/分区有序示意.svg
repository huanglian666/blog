<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="920" height="360" rx="10" fill="#f8fafc"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">RocketMQ 分区有序示意</text>

  <!-- 生产者 -->
  <rect x="40" y="90" width="190" height="180" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="135" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">生产者</text>
  <rect x="60" y="140" width="150" height="44" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="135" y="167" text-anchor="middle" font-size="14" fill="#065f46">湖南订单消息</text>
  <rect x="60" y="204" width="150" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="135" y="231" text-anchor="middle" font-size="14" fill="#1e40af">湖北订单消息</text>

  <!-- Broker -->
  <rect x="330" y="70" width="260" height="220" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="460" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Broker（消息队列）</text>
  <rect x="350" y="120" width="220" height="60" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="460" y="145" text-anchor="middle" font-size="14" fill="#065f46">queue-1</text>
  <text x="460" y="166" text-anchor="middle" font-size="12" fill="#475569">固定存放湖南省的订单消息</text>
  <rect x="350" y="204" width="220" height="60" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="460" y="229" text-anchor="middle" font-size="14" fill="#1e40af">queue-2</text>
  <text x="460" y="250" text-anchor="middle" font-size="12" fill="#475569">固定存放湖北省的订单消息</text>

  <!-- 消费者 -->
  <rect x="690" y="90" width="190" height="180" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="785" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">消费者（同一组）</text>
  <rect x="710" y="140" width="150" height="44" rx="6" fill="#fef9c3" stroke="#eab308"/>
  <text x="785" y="167" text-anchor="middle" font-size="13" fill="#713f12">单线程顺序消费 queue-1</text>
  <rect x="710" y="204" width="150" height="44" rx="6" fill="#fef9c3" stroke="#eab308"/>
  <text x="785" y="231" text-anchor="middle" font-size="13" fill="#713f12">单线程顺序消费 queue-2</text>

  <!-- 箭头 -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <line x1="212" y1="162" x2="346" y2="145" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="212" y1="226" x2="346" y2="239" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="572" y1="150" x2="706" y2="162" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="572" y1="234" x2="706" y2="226" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="460" y="330" text-anchor="middle" font-size="14" fill="#475569">同一省份的消息固定进入同一 queue，queue 内按 下单 → 付款 → 发货 的顺序消费，即保证该省订单有序</text>
</svg>
